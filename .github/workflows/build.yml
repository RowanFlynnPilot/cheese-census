name: build

on:
  workflow_dispatch:
  # Enable the schedule only after all four scrapers are implemented —
  # a scheduled run that can only fail is noise, not automation.
  # schedule:
  #   - cron: "0 11 * * 1"   # Mondays 11:00 UTC

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Scrape
        run: |
          python scrapers/datcp.py
          python scrapers/dfw.py
          python scrapers/masters.py
          python scrapers/contests.py

      - name: Build
        run: python build.py

      - name: Commit refreshed data
        run: |
          git config user.name "cheese-census-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/raw build queue
          git diff --cached --quiet || git commit -m "Refresh data"
          git push
