# Deploys the web front end to GitHub Pages — the PRODUCTION build only.
# sync-data.mjs runs without --draft, which DELETES every draft overlay
# (hotlinked product photos, maker blurbs, facility logos), and
# VITE_DATA_STATUS stays unset so the provisional-data banner remains until
# editorial review is complete. The site reads the committed build/*.json;
# no scraper runs here.
#
# Two gates run first, and either one failing stops the deploy loudly:
#   1. build/ must be current — python build.py is re-run from the committed
#      inputs and must reproduce build/ byte for byte. A stale build/ (an
#      override edited without rebuilding) would otherwise ship old data
#      silently; a non-reproducible one would break the determinism promise.
#   2. The front end's engine tests must pass.
name: deploy-pages

on:
  push:
    branches: [main, scrapers-and-merge] # drop the feature branch after merge
    paths:
      - "web/**"
      - "build/**"
      - "data/**"
      - "build.py"
      - "models.py"
      - "similarity.py"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Verify build/ is current and reproducible
        run: |
          python build.py
          if ! git diff --quiet -- build/; then
            echo "::error::build/ is stale or non-deterministic — run 'python build.py' locally and commit the result"
            git --no-pager diff --stat -- build/
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
      - id: deployment
        uses: actions/deploy-pages@v4
